# Secret-gated eval: builds the Demo Family with the real adapters and runs
# the golden set. Non-blocking by design — it never runs on pull requests
# (fork PRs can't see secrets, and LLM-judged metrics are too noisy to gate
# on). The exit status is gated on per-tool quality floors: a red run on
# main means a tool regressed below its measured frontier, not that a
# known-hard question is still hard.
name: Eval

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m homelore.evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
