# Release to PyPI via trusted publishing (OIDC — no API token stored) when a
# version tag is pushed. Tag with `git tag vX.Y.Z && git push --tags` after
# bumping pyproject.toml; the guard step keeps a mistyped tag from shipping a
# mislabeled package.
#
# One-time setup before the first tag: create a "pypi" environment in the
# GitHub repo settings, and register this repo + workflow + environment as a
# trusted publisher for the "homelore" project on pypi.org.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Check tag matches package version
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
